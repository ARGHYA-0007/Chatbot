<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LangGraph Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --panel-2: #1d2130;
    --border: #2a2f3f;
    --text: #e7e9ee;
    --muted: #8b90a3;
    --accent: #6c8cff;
    --user-bubble: #2a3350;
    --ai-bubble: #1f2333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #new-chat-btn {
    margin: 12px;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #new-chat-btn:hover { opacity: 0.9; }
  #conversations {
    overflow-y: auto;
    flex: 1;
    padding: 0 8px;
  }
  .conv-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .conv-item:hover { background: var(--panel-2); }
  .conv-item.active { background: var(--panel-2); color: var(--text); }

  /* Main chat area */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 65%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
  }
  .tools-used {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  #empty-state {
    margin: auto;
    color: var(--muted);
    text-align: center;
  }
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #input-bar input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #input-bar button {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #input-bar button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="sidebar">
  <button id="new-chat-btn">+ New chat</button>
  <div id="conversations"></div>
</div>

<div id="main">
  <div id="messages">
    <div id="empty-state">Start a new chat, or pick one from the left.</div>
  </div>
  <div id="input-bar">
    <input id="chat-input" type="text" placeholder="Message the bot..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  // Point this at wherever your FastAPI server is running.
  const API_BASE = "http://localhost:8000";

  let activeThreadId = null;

  const conversationsEl = document.getElementById("conversations");
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");
  const newChatBtn = document.getElementById("new-chat-btn");

  async function loadConversations() {
    const res = await fetch(`${API_BASE}/conversations`);
    const data = await res.json();
    conversationsEl.innerHTML = "";
    data.forEach(conv => {
      const item = document.createElement("div");
      item.className = "conv-item" + (conv.thread_id === activeThreadId ? " active" : "");
      item.textContent = conv.title || "New Chat";
      item.title = conv.thread_id;
      item.addEventListener("click", () => openConversation(conv.thread_id));
      conversationsEl.appendChild(item);
    });
  }

  function renderMessage(role, content, toolsUsed) {
    document.getElementById("empty-state")?.remove();
    const bubble = document.createElement("div");
    bubble.className = "msg " + (role === "user" ? "user" : "ai");
    bubble.textContent = content;
    if (toolsUsed && toolsUsed.length) {
      const t = document.createElement("div");
      t.className = "tools-used";
      t.textContent = "tools used: " + toolsUsed.join(", ");
      bubble.appendChild(t);
    }
    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function openConversation(threadId) {
    activeThreadId = threadId;
    messagesEl.innerHTML = "";
    await loadConversations(); // refresh highlight

    const res = await fetch(`${API_BASE}/chatbot/${threadId}/history`);
    const data = await res.json();

    if (!data.messages.length) {
      messagesEl.innerHTML = '<div id="empty-state">No messages yet — say hi!</div>';
      return;
    }
    data.messages.forEach(m => renderMessage(m.role, m.content));
  }

  async function startNewChat() {
    const res = await fetch(`${API_BASE}/new-chat`, { method: "POST" });
    const data = await res.json();
    activeThreadId = data.thread_id;
    messagesEl.innerHTML = '<div id="empty-state">Say hi to start the conversation.</div>';
    await loadConversations();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    if (!activeThreadId) {
      renderMessage("ai", "No conversation selected — click '+ New chat' first.");
      return;
    }

    inputEl.value = "";
    sendBtn.disabled = true;
    renderMessage("user", text);

    try {
      const url = `${API_BASE}/chatbot?query=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(activeThreadId)}`;
      const res = await fetch(url, { method: "POST" });

      if (!res.ok) {
        const errText = await res.text();
        console.error("Backend error", res.status, errText);
        renderMessage("ai", `Server returned ${res.status}. Check the browser console and the uvicorn logs.`);
        return;
      }

      const data = await res.json();
      renderMessage("ai", data.AI, data.tools_used);
      await loadConversations(); // title may have just been set
    } catch (err) {
      console.error(err);
      renderMessage("ai", "Couldn't reach the server: " + err.message + ". Is uvicorn running on " + API_BASE + "?");
    } finally {
      sendBtn.disabled = false;
    }
  }

  newChatBtn.addEventListener("click", startNewChat);
  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  // Initial load
  loadConversations();
</script>

</body>
</html>
