<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NeuraDB AI</title>


<!-- GOOGLE FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --bg:#05070b;

    --sidebar:#080b11;

    --panel:#0c1018;

    --panel2:#111621;

    --panel3:#151b27;

    --border:rgba(255,255,255,.08);

    --border-hover:rgba(255,255,255,.15);

    --text:#f1f4f8;

    --muted:#8993a5;

    --faint:#4e586b;

    --accent:#a970ff;

    --accent2:#6d5dfc;

    --cyan:#4ddcff;

    --green:#54e39a;

    --red:#ff6262;

    --shadow:
        0 30px 80px rgba(0,0,0,.5);

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    font-family:"Inter",sans-serif;

    overflow:hidden;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

}


.grid{

    position:absolute;

    inset:-50%;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    transform:perspective(500px)
              rotateX(55deg);

    transform-origin:center;

    animation:gridMove 30s linear infinite;

}


@keyframes gridMove{

    from{
        transform:
            perspective(500px)
            rotateX(55deg)
            translateY(0);
    }

    to{
        transform:
            perspective(500px)
            rotateX(55deg)
            translateY(50px);
    }

}


.glow{

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.08;

}


.glow.one{

    background:#8a4dff;

    top:-250px;

    left:-150px;

    animation:glowMove1 12s infinite alternate ease-in-out;

}


.glow.two{

    background:#1f8cff;

    bottom:-300px;

    right:-200px;

    animation:glowMove2 15s infinite alternate ease-in-out;

}


@keyframes glowMove1{

    to{
        transform:translate(150px,100px);
    }

}


@keyframes glowMove2{

    to{
        transform:translate(-120px,-100px);
    }

}


/* =========================================================
   APP
========================================================= */

.app{

    position:relative;

    width:100vw;

    height:100vh;

    display:flex;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:260px;

    height:100%;

    background:rgba(8,11,17,.88);

    border-right:1px solid var(--border);

    backdrop-filter:blur(25px);

    display:flex;

    flex-direction:column;

    padding:18px;

    position:relative;

    z-index:5;

    animation:sidebarIn .7s cubic-bezier(.16,1,.3,1);

}


@keyframes sidebarIn{

    from{

        transform:translateX(-40px);

        opacity:0;

    }

    to{

        transform:translateX(0);

        opacity:1;

    }

}


/* LOGO */

.brand{

    display:flex;

    align-items:center;

    gap:11px;

    margin-bottom:25px;

}


.brand-icon{

    width:38px;

    height:38px;

    display:grid;

    place-items:center;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #9a63ff,
            #5b49e9
        );

    box-shadow:
        0 0 25px rgba(138,85,255,.25);

    font-family:"JetBrains Mono";

    font-size:13px;

    font-weight:700;

}


.brand-text{

    display:flex;

    flex-direction:column;

}


.brand-name{

    font-weight:700;

    font-size:14px;

}


.brand-sub{

    color:var(--faint);

    font-size:9px;

    margin-top:2px;

    font-family:"JetBrains Mono";

}


/* NEW CHAT */

.new-chat{

    width:100%;

    border:1px solid rgba(169,112,255,.25);

    background:rgba(169,112,255,.07);

    color:#c9aaff;

    border-radius:9px;

    padding:11px;

    cursor:pointer;

    font-family:"JetBrains Mono";

    font-size:11px;

    transition:.25s;

    position:relative;

    overflow:hidden;

}


.new-chat:hover{

    background:rgba(169,112,255,.14);

    border-color:rgba(169,112,255,.5);

    transform:translateY(-2px);

    box-shadow:
        0 10px 30px rgba(169,112,255,.1);

}


.new-chat span{

    margin-right:7px;

}


/* SIDEBAR TITLE */

.sidebar-title{

    color:var(--faint);

    font-family:"JetBrains Mono";

    font-size:9px;

    margin:

        25px

        5px

        10px;

    text-transform:uppercase;

    letter-spacing:1px;

}


/* HISTORY */

.history{

    display:flex;

    flex-direction:column;

    gap:4px;

    overflow:auto;

}


.history::-webkit-scrollbar{

    width:3px;

}


.history-item{

    display:flex;

    align-items:center;

    gap:9px;

    padding:10px;

    border-radius:7px;

    color:var(--muted);

    font-size:11px;

    cursor:pointer;

    transition:.2s;

}


.history-item:hover{

    background:rgba(255,255,255,.04);

    color:var(--text);

}


.history-icon{

    color:var(--faint);

    font-family:"JetBrains Mono";

}


/* SIDEBAR BOTTOM */

.sidebar-bottom{

    margin-top:auto;

}


.system-card{

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    border-radius:10px;

    padding:12px;

}


.system-title{

    font-family:"JetBrains Mono";

    font-size:9px;

    color:var(--muted);

    margin-bottom:10px;

}


.system-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:7px;

    font-size:10px;

}


.system-row span:first-child{

    color:var(--faint);

}


.online{

    color:var(--green);

    display:flex;

    align-items:center;

    gap:5px;

}


.online-dot{

    width:5px;

    height:5px;

    background:var(--green);

    border-radius:50%;

    box-shadow:
        0 0 10px var(--green);

}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

    position:relative;

}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{

    height:64px;

    border-bottom:1px solid var(--border);

    background:rgba(5,7,11,.65);

    backdrop-filter:blur(20px);

    display:flex;

    align-items:center;

    padding:0 25px;

    position:relative;

    z-index:4;

}


.page-title{

    display:flex;

    align-items:center;

    gap:10px;

}


.page-title h1{

    font-size:13px;

    font-weight:600;

}


.model-badge{

    padding:4px 8px;

    border-radius:5px;

    background:rgba(169,112,255,.08);

    border:1px solid rgba(169,112,255,.16);

    color:#b995ff;

    font-family:"JetBrains Mono";

    font-size:8px;

}


.top-actions{

    margin-left:auto;

    display:flex;

    gap:8px;

}


.icon-btn{

    width:32px;

    height:32px;

    display:grid;

    place-items:center;

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    color:var(--muted);

    border-radius:7px;

    cursor:pointer;

    transition:.2s;

}


.icon-btn:hover{

    color:var(--text);

    border-color:var(--border-hover);

    background:rgba(255,255,255,.05);

}


/* =========================================================
   CHAT
========================================================= */

.chat{

    flex:1;

    overflow-y:auto;

    padding:35px 25px 160px;

}


.chat::-webkit-scrollbar{

    width:5px;

}


.chat::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,.08);

    border-radius:20px;

}


/* CHAT WIDTH */

.chat-inner{

    width:100%;

    max-width:900px;

    margin:auto;

}


/* =========================================================
   WELCOME
========================================================= */

.welcome{

    min-height:65vh;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    animation:welcomeIn .9s cubic-bezier(.16,1,.3,1);

}


@keyframes welcomeIn{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.97);

        filter:blur(7px);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);

    }

}


.ai-orb{

    width:82px;

    height:82px;

    border-radius:25px;

    display:grid;

    place-items:center;

    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(169,112,255,.18),
            rgba(77,220,255,.07)
        );

    border:1px solid rgba(169,112,255,.25);

    box-shadow:
        0 0 60px rgba(169,112,255,.12);

    animation:
        orbFloat 4s ease-in-out infinite;

}


.ai-orb::before{

    content:"";

    position:absolute;

    inset:-8px;

    border-radius:31px;

    border:1px solid rgba(169,112,255,.12);

    animation:orbRotate 8s linear infinite;

}


.ai-orb::after{

    content:"";

    position:absolute;

    inset:-17px;

    border-radius:37px;

    border:1px dashed rgba(77,220,255,.08);

    animation:
        orbRotate 14s linear infinite reverse;

}


.ai-orb span{

    font-family:"JetBrains Mono";

    color:#bd9bff;

    font-size:20px;

    font-weight:700;

}


@keyframes orbFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


@keyframes orbRotate{

    to{
        transform:rotate(360deg);
    }

}


.welcome h2{

    margin-top:28px;

    font-size:29px;

    letter-spacing:-1px;

}


.welcome p{

    margin-top:9px;

    color:var(--muted);

    font-size:12px;

}


/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    width:min(600px,100%);

    margin-top:30px;

}


.suggestion{

    text-align:left;

    padding:14px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    color:var(--muted);

    border-radius:10px;

    cursor:pointer;

    transition:
        .25s;

}


.suggestion:hover{

    border-color:
        rgba(169,112,255,.3);

    background:
        rgba(169,112,255,.05);

    transform:
        translateY(-4px);

    box-shadow:
        0 15px 30px rgba(0,0,0,.2);

}


.suggestion-title{

    color:var(--text);

    font-size:11px;

    margin-bottom:5px;

}


.suggestion-desc{

    color:var(--faint);

    font-size:9px;

    font-family:"JetBrains Mono";

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    display:flex;

    gap:13px;

    margin-bottom:27px;

    animation:
        messageIn .45s cubic-bezier(.16,1,.3,1);

}


.message.user{

    flex-direction:row-reverse;

    justify-content:flex-end;

}


@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.985);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


.avatar{

    width:30px;

    height:30px;

    flex-shrink:0;

    display:grid;

    place-items:center;

    border-radius:9px;

    font-family:"JetBrains Mono";

    font-size:9px;

    font-weight:700;

}


.message.bot .avatar{

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #5c4be5
        );

    box-shadow:
        0 0 20px rgba(139,92,246,.15);

}


.message.user .avatar{

    background:
        rgba(255,255,255,.07);

    border:
        1px solid var(--border);

    color:var(--muted);

}


.message-content{

    flex:1;

    min-width:0;

}


.message.user .message-content{

    flex:0 1 auto;

    max-width:72%;

    width:fit-content;

    margin-left:auto;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

}


.message-header{

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:7px;

}


.message.user .message-header{

    flex-direction:row-reverse;

}


.message-name{

    font-size:10px;

    font-weight:600;

}


.message-time{

    color:var(--faint);

    font-family:"JetBrains Mono";

    font-size:8px;

}


.message-text{

    color:#dce1ea;

    font-size:13px;

    line-height:1.75;

    white-space:pre-wrap;

    word-break:break-word;

}


.message.user .message-text{

    color:#e4d9ff;

    background:rgba(169,112,255,.09);

    border:1px solid rgba(169,112,255,.18);

    padding:10px 14px;

    border-radius:12px;

    border-top-right-radius:4px;

    text-align:left;

    display:inline-block;

    width:fit-content;

    max-width:100%;

}


/* =========================================================
   CODE BLOCK
========================================================= */

.code-block{

    margin-top:10px;

    background:#07090e;

    border:1px solid var(--border);

    border-radius:9px;

    overflow:hidden;

}


.code-header{

    height:30px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 10px;

    background:rgba(255,255,255,.025);

    border-bottom:1px solid var(--border);

}


.code-language{

    color:var(--faint);

    font-family:"JetBrains Mono";

    font-size:8px;

}


.copy-code{

    border:0;

    background:none;

    color:var(--faint);

    cursor:pointer;

    font-size:8px;

}


.copy-code:hover{

    color:var(--text);

}


.code-block pre{

    padding:14px;

    overflow:auto;

    color:#c9d1df;

    font-family:"JetBrains Mono";

    font-size:11px;

    line-height:1.7;

}


/* =========================================================
   ACTIONS
========================================================= */

.message-actions{

    display:flex;

    gap:5px;

    margin-top:8px;

    opacity:0;

    transition:.2s;

}


.message:hover .message-actions{

    opacity:1;

}


.action{

    border:1px solid var(--border);

    background:rgba(255,255,255,.02);

    color:var(--faint);

    padding:4px 7px;

    border-radius:5px;

    cursor:pointer;

    font-family:"JetBrains Mono";

    font-size:8px;

}


.action:hover{

    color:var(--text);

    border-color:var(--border-hover);

}


/* =========================================================
   THINKING — LangGraph-style reasoning animation
========================================================= */

.typing-message{

    display:flex;

    gap:13px;

    margin-bottom:25px;

    animation:messageIn .4s ease;

}


.avatar.thinking-avatar{

    animation:avatarPulse 1.8s ease-in-out infinite;

}


@keyframes avatarPulse{

    0%,100%{
        box-shadow:0 0 20px rgba(139,92,246,.15);
    }

    50%{
        box-shadow:0 0 28px rgba(139,92,246,.45),
                   0 0 0 4px rgba(139,92,246,.06);
    }

}


.think-card{

    display:flex;

    flex-direction:column;

    gap:12px;

    min-width:260px;

    max-width:420px;

    padding:14px 16px;

    background:rgba(255,255,255,.025);

    border:1px solid var(--border);

    border-radius:12px;

    border-top-left-radius:3px;

}


/* NODE GRAPH */

.think-graph{

    display:flex;

    align-items:center;

}


.think-node{

    width:9px;

    height:9px;

    border-radius:50%;

    background:var(--faint);

    flex-shrink:0;

    animation:nodePulse 3.6s ease-in-out infinite;

}


.think-graph .think-node:nth-child(3){ animation-delay:.9s; }
.think-graph .think-node:nth-child(5){ animation-delay:1.8s; }
.think-graph .think-node:nth-child(7){ animation-delay:2.7s; }


@keyframes nodePulse{

    0%,86%,100%{
        background:var(--faint);
        box-shadow:none;
        transform:scale(1);
    }

    8%{
        background:var(--accent);
        box-shadow:0 0 12px rgba(169,112,255,.75);
        transform:scale(1.5);
    }

    20%{
        background:var(--faint);
        box-shadow:none;
        transform:scale(1);
    }

}


.think-line{

    width:26px;

    height:2px;

    background:var(--border);

    position:relative;

    overflow:hidden;

    flex-shrink:0;

}


.think-line::after{

    content:"";

    position:absolute;

    top:0;

    left:-45%;

    width:45%;

    height:100%;

    background:linear-gradient(90deg, transparent, var(--cyan), transparent);

    animation:lineFlow 3.6s ease-in-out infinite;

}


.think-graph .think-line:nth-child(4)::after{ animation-delay:.9s; }
.think-graph .think-line:nth-child(6)::after{ animation-delay:1.8s; }


@keyframes lineFlow{

    0%,8%{
        left:-45%;
        opacity:0;
    }

    11%{
        opacity:1;
    }

    22%,100%{
        left:145%;
        opacity:0;
    }

}


/* SHIMMER STAGE LABEL */

.think-label{

    position:relative;

    font-family:"JetBrains Mono";

    font-size:11px;

    background:linear-gradient(
        100deg,
        var(--muted) 30%,
        var(--accent) 48%,
        var(--cyan) 56%,
        var(--muted) 74%
    );

    background-size:220% 100%;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:shimmer 1.8s linear infinite;

}


.think-label.pulse{

    animation:shimmer 1.8s linear infinite, stageFade .35s ease;

}


@keyframes shimmer{

    0%{ background-position:220% 0; }

    100%{ background-position:-40% 0; }

}


@keyframes stageFade{

    from{
        opacity:0;
        transform:translateY(3px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* REASONING TRACE LOG */

.think-log{

    display:flex;

    flex-direction:column;

    gap:4px;

}


.think-log-line{

    font-family:"JetBrains Mono";

    font-size:10px;

    color:var(--faint);

    opacity:.5;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    transition:opacity .3s, color .3s;

}


.think-log-line.current{

    color:var(--muted);

    opacity:1;

}


.think-log-line .cursor{

    display:inline-block;

    width:5px;

    height:10px;

    margin-left:2px;

    vertical-align:-1px;

    background:var(--cyan);

    animation:cursorBlink 1s step-end infinite;

}


@keyframes cursorBlink{

    0%,49%{ opacity:1; }

    50%,100%{ opacity:0; }

}



/* =========================================================
   TOOL SELECTION — live agent/tool animation
========================================================= */

.tool-select-card{
    display:flex;
    flex-direction:column;
    gap:11px;
    min-width:280px;
    max-width:470px;
    padding:14px 16px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:12px;
    border-top-left-radius:3px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.tool-select-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.tool-select-title{
    color:var(--text);
    font-family:"JetBrains Mono";
    font-size:10px;
    letter-spacing:.2px;
}

.tool-select-status{
    color:var(--cyan);
    font-family:"JetBrains Mono";
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:.8px;
}

.tool-pool{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
}

.tool-chip{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 8px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:7px;
    background:rgba(255,255,255,.018);
    color:var(--faint);
    font-family:"JetBrains Mono";
    font-size:8px;
    transition:.25s;
}

.tool-chip::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(169,112,255,.18),
        transparent
    );
    transform:translateX(-120%);
}

.tool-chip.scanning{
    color:var(--muted);
    border-color:rgba(169,112,255,.28);
    background:rgba(169,112,255,.05);
}

.tool-chip.scanning::after{
    animation:toolScan .65s ease;
}

.tool-chip.selected{
    color:#e9ddff;
    border-color:rgba(169,112,255,.48);
    background:rgba(169,112,255,.10);
    box-shadow:0 0 18px rgba(169,112,255,.08);
}

.tool-chip.selected .tool-dot{
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
}

.tool-dot{
    width:5px;
    height:5px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--faint);
}

.tool-select-log{
    min-height:14px;
    color:var(--faint);
    font-family:"JetBrains Mono";
    font-size:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tool-select-log .live{
    color:var(--muted);
}

.tool-select-log .cursor{
    display:inline-block;
    width:4px;
    height:9px;
    margin-left:2px;
    vertical-align:-1px;
    background:var(--cyan);
    animation:cursorBlink 1s step-end infinite;
}

@keyframes toolScan{
    from{ transform:translateX(-120%); }
    to{ transform:translateX(120%); }
}

@media(max-width:800px){
    .tool-select-card{
        max-width:300px;
    }
}


/* =========================================================
   INPUT
========================================================= */

.input-wrapper{

    position:absolute;

    bottom:0;

    left:0;

    right:0;

    padding:

        15px

        25px

        22px;

    background:
        linear-gradient(
            transparent,
            rgba(5,7,11,.97) 35%
        );

    z-index:3;

}


.input-inner{

    max-width:900px;

    margin:auto;

}


.input-box{

    display:flex;

    align-items:flex-end;

    gap:10px;

    padding:

        5px

        6px

        5px

        14px;

    background:
        rgba(14,18,27,.92);

    border:1px solid var(--border);

    border-radius:13px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);

    backdrop-filter:blur(20px);

    transition:.25s;

}


.input-box:focus-within{

    border-color:
        rgba(169,112,255,.4);

    box-shadow:

        0 0 0 3px
        rgba(169,112,255,.05),

        0 20px 50px
        rgba(0,0,0,.35);

}


.prompt{

    color:var(--accent);

    font-family:"JetBrains Mono";

    font-size:15px;

    padding-bottom:10px;

}


#query{

    flex:1;

    resize:none;

    min-height:40px;

    max-height:130px;

    padding:10px 0;

    border:none;

    outline:none;

    background:none;

    color:var(--text);

    font-family:"Inter";

    font-size:12px;

    line-height:1.5;

}


#query::placeholder{

    color:var(--faint);

}


.send{

    width:38px;

    height:38px;

    border:none;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #9a67ff,
            #6855e9
        );

    color:white;

    cursor:pointer;

    display:grid;

    place-items:center;

    transition:.2s;

    box-shadow:
        0 5px 20px
        rgba(130,85,255,.15);

}


.send:hover:not(:disabled){

    transform:
        translateY(-2px)
        scale(1.03);

    box-shadow:
        0 10px 30px
        rgba(130,85,255,.3);

}


.send:active:not(:disabled){

    transform:scale(.93);

}


.send:disabled{

    opacity:.35;

    cursor:not-allowed;

    animation:sendPulse 1.4s ease-in-out infinite;

}


@keyframes sendPulse{

    0%,100%{ box-shadow:0 5px 20px rgba(130,85,255,.15); }

    50%{ box-shadow:0 5px 26px rgba(130,85,255,.4); }

}


.input-info{

    display:flex;

    justify-content:space-between;

    padding:

        7px

        5px

        0;

    color:var(--faint);

    font-family:"JetBrains Mono";

    font-size:8px;

}

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const query =
    document.getElementById("query");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const counter =
    document.getElementById("counter");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   TIME
========================================================= */

function getTime(){

    return new Date().toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(resolve => setTimeout(resolve,ms));

}


/* =========================================================
   HIDE WELCOME
========================================================= */

function hideWelcome(){

    if(!document.getElementById("welcome"))
        return;

    const element =
        document.getElementById("welcome");

    element.style.opacity="0";

    element.style.transform=
        "translateY(-15px)";

    setTimeout(
        () => element.remove(),
        300
    );

}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text){

    hideWelcome();


    const message =
        document.createElement("div");

    message.className =
        "message user";


    message.innerHTML = `

        <div class="avatar">
            YOU
        </div>

        <div class="message-content">

            <div class="message-header">

                <span class="message-name">
                    You
                </span>

                <span class="message-time">
                    ${getTime()}
                </span>

            </div>

            <div class="message-text">
                ${escapeHTML(text)}
            </div>

        </div>

    `;


    chatInner.appendChild(message);

    scrollBottom();

}


/* =========================================================
   ADD BOT MESSAGE
========================================================= */

async function addBotMessage(text){

    const message =
        document.createElement("div");

    message.className =
        "message bot";


    message.innerHTML = `

        <div class="avatar">
            AI
        </div>

        <div class="message-content">

            <div class="message-header">

                <span class="message-name">
                    NeuraDB
                </span>

                <span class="message-time">
                    ${getTime()}
                </span>

            </div>

            <div
                class="message-text"
                data-text=""
            ></div>

            <div class="message-actions">

                <button
                    class="action"
                    onclick="copyMessage(this)"
                >
                    copy
                </button>

            </div>

        </div>

    `;


    chatInner.appendChild(message);


    const textElement =
        message.querySelector(
            ".message-text"
        );


    /*
       TYPEWRITER EFFECT
    */

    let current="";


    for(
        let i=0;
        i<text.length;
        i++
    ){

        current += text[i];

        textElement.textContent =
            current;

        scrollBottom();

        await new Promise(
            resolve =>
                setTimeout(resolve,7)
        );

    }


    /*
       Detect code
    */

    formatCodeBlocks(
        textElement
    );

}


/* =========================================================
   THINKING ANIMATION — LangGraph node trace
========================================================= */

const thinkStageLabels = [
    "thinking",
    "routing",
    "retrieving",
    "reasoning",
    "generating"
];

const thinkTraceLines = [
    "parsing user intent",
    "routing through langgraph nodes",
    "retrieving relevant context",
    "reasoning over context",
    "composing response"
];

const thinkState = {

    active:false,

    stageTimer:null,

    stageIdx:0

};


const toolSelectionState = {
    active:false,
    timer:null,
    index:0,
    selected:null
};

const availableTools = [
    {name:"get_weather", label:"weather"},
    {name:"dictionary", label:"dictionary"},
    {name:"country_info", label:"country info"},
    {name:"convert_currency", label:"currency"},
    {name:"search_books", label:"book search"},
    {name:"get_news", label:"news"},
    {name:"execute_code", label:"code execution"},
    {name:"get_joke", label:"joke"}
];

function createToolSelectionHTML(){
    return `
        <div class="tool-select-card">
            <div class="tool-select-head">
                <span class="tool-select-title">TOOL ROUTER</span>
                <span class="tool-select-status" id="toolSelectStatus">
                    scanning
                </span>
            </div>

            <div class="tool-pool">
                ${availableTools.map((tool, index) => `
                    <div class="tool-chip" id="tool-chip-${index}">
                        <span class="tool-dot"></span>
                        <span>${tool.name}</span>
                    </div>
                `).join("")}
            </div>

            <div class="tool-select-log" id="toolSelectLog">
                <span class="live">checking available tools<span class="cursor"></span></span>
            </div>
        </div>
    `;
}

/*
 * This is a visual frontend animation.
 * It shows the tool-routing phase while FastAPI/LangGraph is processing.
 * The actual selected tool is determined by LangGraph on the backend.
 */
function startToolSelectionAnimation(){
    toolSelectionState.active = true;
    toolSelectionState.index = 0;
    toolSelectionState.selected = null;

    const typing = document.getElementById("typing");
    if(!typing) return;

    const card = typing.querySelector(".think-card");
    if(!card) return;

    card.innerHTML = createToolSelectionHTML();

    const status = document.getElementById("toolSelectStatus");
    const log = document.getElementById("toolSelectLog");

    toolSelectionState.timer = setInterval(() => {
        if(!toolSelectionState.active) return;

        const index = toolSelectionState.index % availableTools.length;
        const chip = document.getElementById(`tool-chip-${index}`);

        document.querySelectorAll(".tool-chip").forEach(el => {
            el.classList.remove("scanning");
        });

        if(chip){
            chip.classList.add("scanning");
            void chip.offsetWidth;
            chip.classList.remove("scanning");
            chip.classList.add("scanning");

            if(log){
                log.innerHTML =
                    `<span class="live">evaluating ${availableTools[index].name}<span class="cursor"></span></span>`;
            }
        }

        if(status){
            status.textContent = "evaluating";
        }

        toolSelectionState.index++;
    }, 420);
}

function showToolSelected(toolName){
    if(!toolName) return;

    const index = availableTools.findIndex(
        tool => tool.name === toolName
    );

    if(index === -1) return;

    toolSelectionState.selected = toolName;

    document.querySelectorAll(".tool-chip").forEach(el => {
        el.classList.remove("scanning");
        el.classList.remove("selected");
    });

    const chip = document.getElementById(`tool-chip-${index}`);

    if(chip){
        chip.classList.add("selected");
    }

    const status = document.getElementById("toolSelectStatus");
    const log = document.getElementById("toolSelectLog");

    if(status){
        status.textContent = "selected";
    }

    if(log){
        log.innerHTML =
            `<span class="live">selected ${escapeHTML(toolName)}</span>`;
    }
}

function stopToolSelectionAnimation(){
    toolSelectionState.active = false;

    if(toolSelectionState.timer){
        clearInterval(toolSelectionState.timer);
        toolSelectionState.timer = null;
    }
}


function showTyping(){

    const typing =
        document.createElement("div");

    typing.className =
        "typing-message";

    typing.id =
        "typing";


    typing.innerHTML = `

        <div class="avatar thinking-avatar">
            AI
        </div>

        <div class="message-content">

            <div class="message-header">

                <span class="message-name">
                    NeuraDB
                </span>

                <span class="think-label" id="thinkLabel">
                    ${thinkStageLabels[0]}
                </span>

            </div>

            <div class="think-card">

                <div class="think-graph">

                    <span class="think-node"></span>
                    <span class="think-line"></span>
                    <span class="think-node"></span>
                    <span class="think-line"></span>
                    <span class="think-node"></span>
                    <span class="think-line"></span>
                    <span class="think-node"></span>

                </div>

                <div
                    class="think-log"
                    id="thinkLog"
                ></div>

            </div>

        </div>

    `;


    chatInner.appendChild(typing);

    scrollBottom();

    startThinkingAnimation();
    startToolSelectionAnimation();

}


function startThinkingAnimation(){

    thinkState.active = true;

    thinkState.stageIdx = 0;


    thinkState.stageTimer = setInterval(() => {

        thinkState.stageIdx =
            (thinkState.stageIdx + 1) % thinkStageLabels.length;

        const el =
            document.getElementById("thinkLabel");

        if(el){

            el.textContent =
                thinkStageLabels[thinkState.stageIdx];

            el.classList.remove("pulse");

            void el.offsetWidth;

            el.classList.add("pulse");

        }

    },1300);


    runThinkingTrace();

}


async function runThinkingTrace(){

    let index = 0;


    while(thinkState.active){

        const container =
            document.getElementById("thinkLog");

        if(!container)
            return;


        const line =
            document.createElement("div");

        line.className =
            "think-log-line current";


        container.appendChild(line);


        Array.from(container.children).forEach(child => {

            if(child !== line)
                child.classList.remove("current");

        });


        while(container.children.length > 3){

            container.removeChild(container.firstChild);

        }


        const text =
            thinkTraceLines[index % thinkTraceLines.length];


        for(let c=1; c<=text.length; c++){

            if(!thinkState.active)
                return;

            line.innerHTML =
                `${escapeHTML(text.slice(0,c))}<span class="cursor"></span>`;

            scrollBottom();

            await sleep(22);

        }


        line.innerHTML =
            escapeHTML(text);


        await sleep(550);


        index++;

    }

}


/* =========================================================
   REMOVE TYPING
========================================================= */

function removeTyping(){

    thinkState.active = false;
    stopToolSelectionAnimation();

    if(thinkState.stageTimer){

        clearInterval(thinkState.stageTimer);

        thinkState.stageTimer = null;

    }


    const typing =
        document.getElementById("typing");

    if(typing){

        typing.style.opacity="0";

        typing.style.transform=
            "translateY(-8px)";

        setTimeout(
            () => typing.remove(),
            150
        );

    }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    requestAnimationFrame(() => {

        chat.scrollTo({

            top:
                chat.scrollHeight,

            behavior:
                "smooth"

        });

    });

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        query.value.trim();


    if(!text)
        return;


    addUserMessage(text);


    query.value="";

    updateCounter();

    autoResize();


    send.disabled=true;


    showTyping();


    const start =
        performance.now();


    try{

        const response =
            await fetch(

                "http://127.0.0.1:8000/chatbot?query="
                +
                encodeURIComponent(text),

                {
                    method:"POST"
                }

            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const end =
            performance.now();


        console.log(
            "Response time:",
            Math.round(end-start),
            "ms"
        );


        removeTyping();


        if(data.AI){

            await addBotMessage(
                String(data.AI)
            );

        }
        else{

            await addBotMessage(
                "The AI returned an empty response."
            );

        }


    }
    catch(error){

        console.error(error);


        removeTyping();


        await addBotMessage(

            "⚠ Unable to connect to the AI server.\n\n"
            +
            "Make sure FastAPI is running on:\n"
            +
            "http://127.0.0.1:8000"

        );

    }


    send.disabled=false;

    query.focus();

}


/* =========================================================
   SUGGESTION
========================================================= */

function useSuggestion(text){

    query.value =
        text;

    updateCounter();

    autoResize();

    query.focus();

    sendMessage();

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

    chatInner.innerHTML="";


    const welcomeElement =
        document.createElement("div");

    welcomeElement.className =
        "welcome";

    welcomeElement.id =
        "welcome";


    welcomeElement.innerHTML = `

        <div class="ai-orb">

            <span>
                AI
            </span>

        </div>


        <h2>
            What can I help you with?
        </h2>


        <p>
            Powered by LangGraph · Ollama · FastAPI
        </p>


        <div class="suggestions">

            <button
                class="suggestion"
                onclick="useSuggestion('Explain what LangGraph is')"
            >

                <div class="suggestion-title">
                    Explain LangGraph
                </div>

                <div class="suggestion-desc">
                    Learn how stateful AI workflows work
                </div>

            </button>


            <button
                class="suggestion"
                onclick="useSuggestion('Give me a Python project idea')"
            >

                <div class="suggestion-title">
                    Python project idea
                </div>

                <div class="suggestion-desc">
                    Generate an interesting project
                </div>

            </button>


            <button
                class="suggestion"
                onclick="useSuggestion('Explain PostgreSQL joins with examples')"
            >

                <div class="suggestion-title">
                    PostgreSQL joins
                </div>

                <div class="suggestion-desc">
                    Learn SQL with practical examples
                </div>

            </button>


            <button
                class="suggestion"
                onclick="useSuggestion('Help me debug my Python code')"
            >

                <div class="suggestion-title">
                    Debug my code
                </div>

                <div class="suggestion-desc">
                    Find and explain programming errors
                </div>

            </button>

        </div>

    `;


    chatInner.appendChild(
        welcomeElement
    );


    query.focus();

}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat(){

    chatInner.innerHTML="";

    newChat();

}


/* =========================================================
   COPY MESSAGE
========================================================= */

function copyMessage(button){

    const content =
        button
        .closest(".message-content")
        .querySelector(".message-text")
        .innerText;


    navigator.clipboard.writeText(
        content
    );


    button.textContent =
        "copied ✓";


    setTimeout(
        () => {

            button.textContent =
                "copy";

        },
        1500
    );

}


/* =========================================================
   CODE FORMATTING
========================================================= */

function formatCodeBlocks(element){

    const text =
        element.textContent;


    if(
        text.includes("```")
    ){

        const parts =
            text.split("```");


        if(parts.length >= 3){

            element.innerHTML="";


            for(
                let i=0;
                i<parts.length;
                i++
            ){

                if(i % 2 === 0){

                    if(parts[i].trim()){

                        const p =
                            document.createElement(
                                "span"
                            );

                        p.textContent =
                            parts[i];

                        element.appendChild(p);

                    }

                }
                else{

                    let code =
                        parts[i];


                    let language =
                        "code";


                    const firstLine =
                        code.split("\n")[0]
                        .trim();


                    if(
                        firstLine &&
                        firstLine.length < 20 &&
                        !firstLine.includes(" ")
                    ){

                        language =
                            firstLine;

                        code =
                            code
                            .split("\n")
                            .slice(1)
                            .join("\n");

                    }


                    const block =
                        document.createElement(
                            "div"
                        );

                    block.className =
                        "code-block";


                    block.innerHTML = `

                        <div class="code-header">

                            <span class="code-language">
                                ${escapeHTML(language)}
                            </span>

                            <button
                                class="copy-code"
                            >
                                copy
                            </button>

                        </div>

                        <pre>${escapeHTML(code.trim())}</pre>

                    `;


                    const copy =
                        block.querySelector(
                            ".copy-code"
                        );


                    copy.onclick =
                        async () => {

                            await navigator.clipboard
                                .writeText(code.trim());

                            copy.textContent =
                                "copied ✓";

                            setTimeout(
                                () => {

                                    copy.textContent =
                                        "copy";

                                },
                                1200
                            );

                        };


                    element.appendChild(
                        block
                    );

                }

            }

        }

    }

}


/* =========================================================
   COUNTER
========================================================= */

function updateCounter(){

    counter.textContent =
        `${query.value.length} / 2000`;

}


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResize(){

    query.style.height="auto";

    query.style.height =
        Math.min(
            query.scrollHeight,
            130
        ) + "px";

}


/* =========================================================
   INPUT EVENTS
========================================================= */

query.addEventListener(
    "input",
    () => {

        updateCounter();

        autoResize();

    }
);


query.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
            &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   CTRL + K
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.ctrlKey &&
            event.key.toLowerCase()==="k"
        ){

            event.preventDefault();

            query.focus();

        }

    }
);


/* =========================================================
   START
========================================================= */

query.focus();

</script>
